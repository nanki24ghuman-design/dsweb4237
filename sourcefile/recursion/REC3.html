  <h2>Q3. Calculate the sum of natural numbers till 10 using recursion.</h2>
  <pre><h3>
#include&lt;stdio.h&gt;
int sum(int n){
    if(n==0){
    return 0;
    }
    return n +sum(n-1);
}
int main(){
    int result;
    result=sum(10);
    printf(&quot;the sum of number till 10 is %d&quot;,result);
    return 0;

}
